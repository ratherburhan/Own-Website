{% extends 'base.html' %}

{% block content %}

<div id="loader" class="container py-5 text-center">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div id="tour-content" style="display: none;">

    <div class="container px-4 py-5" id="custom-cards">
        <h2 class="pb-2 border-bottom h2 section-title">Tour Plan</h2>

        <div class="row row-cols-1 row-cols-lg-4 align-items-stretch g-4 py-5">
            <div class="col w-100">
                <div id="hero-card" class="card card-cover h-100 overflow-hidden text-white bg-dark rounded-5 shadow-lg" style="background-position: center; background-size: cover; background-image: url('/static/assets/images/unsplash.jpg');">
                    <div class="d-flex flex-column h-100 p-5 pb-3 text-white text-shadow-1">
                        <h2 id="t-title" class="pt-5 mt-5 mb-4 display-6 lh-1 fw-bold"></h2>
                        <ul class="d-flex list-unstyled mt-auto">
                            <li class="me-auto">
                                <svg class="bi me-2" width="2em" height="2em" fill="white"><use xlink:href="/static/assets/svg/bootstrap-icons.svg#cash-coin"></use></svg>
                                <small id="t-price"></small>
                            </li>
                            <li class="d-flex align-items-center me-3">
                                <svg class="bi me-2" width="2em" height="2em" fill="white"><use xlink:href="/static/assets/svg/bootstrap-icons.svg#geo-alt-fill"></use></svg>
                                <small id="t-location"></small>
                            </li>
                            <li class="d-flex align-items-center">
                                <svg class="bi me-2" width="2em" height="2em" fill="white"><use xlink:href="/static/assets/svg/bootstrap-icons.svg#clock-fill"></use></svg>
                                <small id="t-time"></small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <p class="section-subtitle">Detailed Itinerary</p>
        <div class="accordion" id="accordionItinerary">
            </div>
    </div>

    <div class="container px-4 py-5" id="icon-grid">
    <h2 class="pb-2 border-bottom">Tour Amenities</h2>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-3 g-4 py-5">
      <div class="col d-flex align-items-start">
        <svg class="bi text-muted flex-shrink-0 me-3" width="1.75em" height="1.75em"><use xlink:href="/static/assets/svg/bootstrap-icons.svg#credit-card"></use></svg>
        <div>
          <h4 class="fw-bold mb-0">Accepts Credit Cards</h4>
        </div>
      </div>
      <div class="col d-flex align-items-start">
        <svg class="bi text-muted flex-shrink-0 me-3" width="1.75em" height="1.75em"><use xlink:href="/static/assets/svg/bootstrap-icons.svg#p-circle-fill"></use></svg>
        <div>
          <h4 class="fw-bold mb-0">Car Parking</h4>
        </div>
      </div>
      <div class="col d-flex align-items-start">
        <img class="bi text-muted flex-shrink-0 me-3" width="28" src="{{ url_for('static', filename='/assets/svg/laundry.svg') }}" alt="Bootstrap">
        <div>
          <h4 class="fw-bold mb-0">Laundry service</h4>
        </div>
      </div>
      <div class="col d-flex align-items-start">
        <img class="bi text-muted flex-shrink-0 me-3" width="28" src="{{ url_for('static', filename='/assets/svg/reservations.svg') }}" alt="Bootstrap">
        <div>
          <h4 class="fw-bold mb-0">Reservations</h4>
        </div>
      </div>
      <div class="col d-flex align-items-start">
        <img class="bi text-muted flex-shrink-0 me-3" width="28" src="{{ url_for('static', filename='/assets/svg/restaurant.svg') }}" alt="Bootstrap">
        <div>
          <h4 class="fw-bold mb-0">Restaurant</h4>
        </div>
      </div>
      <div class="col d-flex align-items-start">
        <svg class="bi text-muted flex-shrink-0 me-3" width="1.75em" height="1.75em"><use xlink:href="/static/assets/svg/bootstrap-icons.svg#wifi"></use></svg>
        <div>
          <h4 class="fw-bold mb-0">Wireless Internet</h4>
        </div>
      </div>
    </div>
  </div>

    <div class="container pb-5">
        <a href="{{ url_for('contact') }}" class="btn btn-primary book-button">Book Now</a>
    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Extract tour_id from URL (e.g. ?tour_id=5)
        const params = new URLSearchParams(window.location.search);
        const tourId = parseInt(params.get('tour_id'));

        // 2. Fetch the JSON data
        fetch('/static/data/tours.json')
            .then(response => response.json())
            .then(data => {
                // 3. Find the specific tour
                const tour = data.find(item => item.id === tourId);

                if (tour) {
                    // 4. Inject Hero Data
                    document.getElementById('t-title').textContent = tour.title;
                    document.getElementById('t-price').textContent = `From ₹${tour.price}`;
                    document.getElementById('t-location').textContent = tour.location;
                    document.getElementById('t-time').textContent = tour.time;

                    // 5. Build Itinerary Loop
                    const accordion = document.getElementById('accordionItinerary');
                    let html = '';

                    tour.itinerary.forEach((day, index) => {
                        const isFirst = index === 0; // First item is expanded by default
                        const collapseId = `collapse${index}`;
                        const headingId = `heading${index}`;

                        html += `
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="${headingId}">
                                <button class="accordion-button ${isFirst ? '' : 'collapsed'}" type="button"
                                    data-bs-toggle="collapse" data-bs-target="#${collapseId}"
                                    aria-expanded="${isFirst}" aria-controls="${collapseId}">
                                    ${day.day_title}
                                </button>
                            </h2>
                            <div id="${collapseId}" class="accordion-collapse collapse ${isFirst ? 'show' : ''}"
                                aria-labelledby="${headingId}" data-bs-parent="#accordionItinerary">
                                <div class="accordion-body">
                                    ${day.day_desc}
                                </div>
                            </div>
                        </div>`;
                    });

                    accordion.innerHTML = html;

                    // 6. reveal content
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('tour-content').style.display = 'block';
                } else {
                    document.getElementById('loader').innerHTML = '<p class="text-danger">Tour details not found.</p>';
                }
            })
            .catch(err => {
                console.error("Error fetching tours:", err);
                document.getElementById('loader').innerHTML = '<p class="text-danger">System Error: Could not load data.</p>';
            });
    });
</script>

{% endblock %}
